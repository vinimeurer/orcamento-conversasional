services:
  postgres:
    image: postgres:16-alpine
    container_name: orcamento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orcamento
      POSTGRES_USER: orcamento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcamento}
    ports:
      - "5432:5432"
    volumes:
      - orcamento_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamento -d orcamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  nanobot:
    build:
      context: .
      dockerfile: nanobot_config/Dockerfile
    container_name: orcamento_nanobot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Default aplicado aqui para o container subir mesmo sem a variável
      # definida no .env (o nanobot falha se ${GEMINI_MODEL} estiver vazio).
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      DATABASE_URL: postgresql://orcamento:orcamento@postgres:5432/orcamento
    volumes:
      - ./nanobot_config/config.docker.json:/root/.nanobot/config.json:ro
      - ./nanobot_config/SOUL.md:/root/.nanobot/workspace/SOUL.md:ro
      - ./nanobot_config/AGENTS.md:/root/.nanobot/workspace/AGENTS.md:ro
      - ./nanobot_config/USER.md:/root/.nanobot/workspace/USER.md:ro
      - orcamento_nanobot_memory:/root/.nanobot/workspace/memory
      # Servidor MCP executado via stdio dentro deste container.
      # A estrutura mcp_server/ + db/ precisa manter o layout relativo,
      # porque o expense_tools.py importa db.connection pelo diretório pai.
      - ./mcp_server:/opt/mcp_server:ro
      - ./db:/opt/db:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  orcamento_pgdata:
  orcamento_nanobot_memory:
